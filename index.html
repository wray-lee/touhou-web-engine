<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/touhou-web-engine/favicon.png" />
    <title>Touhou Web Engine - TH08 Full Campaign</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b0a12;
        color: #e8dcc8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }
      header {
        margin-bottom: 12px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, #c41e3a, #d4a94e, #5bb8b3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 4px;
      }
      .instructions {
        font-size: 0.85rem;
        color: #8c827a;
      }
      .instructions span {
        display: inline-block;
        padding: 1px 6px;
        background: #221c24;
        border: 1px solid #4a3e4e;
        border-radius: 4px;
        color: #e8dcc8;
        margin: 0 2px;
        font-family: monospace;
      }
      /*
       * The canvas is 4:3, so it is sized off whichever viewport axis binds it.
       * No 640px ceiling: on a tall window the game fills the height instead of
       * floating as a small card in the middle of the page.
       */
      #game-root {
        position: relative;
        width: min(100vw, calc(100dvh * 4 / 3));
        height: min(100dvh, calc(100vw * 3 / 4));
        max-width: 100vw;
        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.8),
          0 0 20px rgba(91, 184, 179, 0.2);
        border: 2px solid #2f7571;
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* ---- front-end menu chrome ---- */
      #menu-root {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        overflow: auto;
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(91, 184, 179, 0.16), transparent 60%), rgba(7, 6, 14, 0.9);
        backdrop-filter: blur(6px);
      }
      .th08-card {
        position: relative;
        width: min(94vw, 880px);
        margin: 24px auto;
        padding: 30px 34px 26px;
        display: grid;
        gap: 14px;
        color: #e8dcc8;
        background: linear-gradient(158deg, rgba(34, 28, 50, 0.96), rgba(12, 11, 22, 0.97));
        border: 1px solid rgba(91, 184, 179, 0.55);
        border-radius: 14px;
        box-shadow:
          0 22px 90px rgba(0, 0, 0, 0.8),
          inset 0 0 60px rgba(91, 184, 179, 0.07);
      }
      .th08-card::before {
        content: '';
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(212, 169, 78, 0.28);
        border-radius: 10px;
        pointer-events: none;
      }
      .th08-card-title {
        text-align: center;
        background-image: url('/touhou-web-engine/assets/ui/title-backdrop.png');
        background-size: cover;
        background-position: center;
      }
      .th08-menu-kicker {
        margin: 0;
        color: #5bb8b3;
        letter-spacing: 0.24em;
        font: 0.72rem/1.4 monospace;
        text-transform: uppercase;
      }
      .th08-title-logo {
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 4.6rem);
        letter-spacing: 0.16em;
        color: #f4dfae;
        text-shadow:
          0 0 26px rgba(196, 30, 58, 0.85),
          0 6px 0 rgba(0, 0, 0, 0.5);
      }
      .th08-title-small {
        margin: 0;
        font-size: 1.9rem;
        letter-spacing: 0.08em;
        color: #d4a94e;
      }
      .th08-menu-subtitle,
      .th08-menu-hint {
        margin: 0;
        color: #a69a9d;
        font-size: 0.84rem;
      }
      .th08-menu-list {
        display: grid;
        gap: 8px;
      }
      .th08-menu-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        font: inherit;
        color: #e8dcc8;
        text-align: left;
        background: rgba(23, 21, 35, 0.9);
        border: 1px solid #4a3e4e;
        border-radius: 8px;
        cursor: pointer;
      }
      .th08-menu-item:hover,
      .th08-menu-item.is-active {
        border-color: #d4a94e;
        background: rgba(52, 42, 30, 0.95);
        color: #ffeec4;
      }
      .th08-opt-value {
        color: #5bb8b3;
        font-family: monospace;
      }
      .th08-team-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .th08-team-card {
        display: grid;
        gap: 4px;
        padding: 14px 12px;
        color: #e8dcc8;
        font: inherit;
        text-align: center;
        background: linear-gradient(180deg, rgba(45, 36, 62, 0.95), rgba(15, 13, 26, 0.95));
        border: 1px solid #4a3e4e;
        border-radius: 12px;
        cursor: pointer;
      }
      .th08-team-card.is-active {
        border-color: #d4a94e;
        box-shadow:
          0 0 0 1px rgba(212, 169, 78, 0.5),
          0 12px 34px rgba(196, 30, 58, 0.28);
      }
      .th08-team-pairs {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 8px;
      }
      .th08-team-seat {
        display: grid;
        justify-items: center;
        gap: 3px;
      }
      .th08-team-seat i {
        font:
          600 9px/1 ui-monospace,
          monospace;
        font-style: normal;
        color: #8d8199;
        letter-spacing: 0.1em;
      }
      .th08-team-portrait {
        width: 88px;
        height: 118px;
        margin: 0 auto;
        object-fit: contain;
        object-position: top center;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55));
      }
      /* Only the painted fallbacks need the frame; the retail face pages are already cut out. */
      .th08-team-card img[src*='/assets/player/'] {
        image-rendering: pixelated;
        background: url('/touhou-web-engine/assets/ui/portrait-frame.png') center/contain no-repeat;
      }
      .th08-team-name {
        font-size: 1.05rem;
        color: #f4dfae;
      }
      .th08-team-sub {
        font-size: 0.78rem;
        color: #5bb8b3;
      }
      .th08-team-stats {
        font-size: 0.7rem;
        color: #9a8f95;
        font-family: monospace;
      }
      .th08-diff-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 11px 16px;
        color: #e8dcc8;
        text-align: left;
        font: inherit;
        background: rgba(23, 21, 35, 0.9);
        border: 1px solid #4a3e4e;
        border-radius: 8px;
        cursor: pointer;
      }
      .th08-diff-row.is-active {
        border-color: #c41e3a;
        background: rgba(60, 22, 32, 0.9);
      }
      .th08-diff-name {
        min-width: 92px;
        font-weight: 700;
        color: #f4dfae;
        letter-spacing: 0.06em;
      }
      .th08-diff-logo {
        width: 96px;
        height: 54px;
        flex: 0 0 auto;
        object-fit: contain;
        filter: saturate(0.55) brightness(0.72);
        transition: filter 120ms ease;
      }
      .th08-diff-row.is-active .th08-diff-logo {
        filter: none;
      }
      .th08-diff-brief {
        font-size: 0.8rem;
        color: #a69a9d;
      }
      /*
       * The retail settlement screen. It is a 640x480 picture, so the stage keeps
       * that ratio and the stat rows are placed in picture units by the same code
       * that runs the animation, never by a stylesheet guess.
       */
      .th08-result-stage {
        position: relative;
        width: min(100%, 640px);
        margin: 0 auto;
        aspect-ratio: 4 / 3;
        background: #05060a;
        container-type: inline-size;
      }
      /*
       * A finished run should fill the window, so the settlement picture is given
       * whatever height is left after the rows under it and its 4:3 width follows
       * from that. Retail authored the panel at 640x480; the canvas upscales with
       * `image-rendering: pixelated`, so it stays crisp at any size.
       */
      .th08-card-results {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: min(100vw, 980px);
        height: 100dvh;
        margin: 0 auto;
        padding: 8px 12px;
      }
      /*
       * The settlement picture is the whole 640x480 frame, so it is given the
       * height the window offers and its width follows from its own ratio. 200px is
       * the budget for the banner, the extra rows, the form and the three exits;
       * anything larger and the exits fall off the bottom of the window.
       */
      .th08-card-results .th08-result-stage {
        width: min(100%, calc((100dvh - 200px) * 4 / 3));
      }
      /* The three exits read as one row here, because the panel is the subject. */
      .th08-card-results .th08-menu-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .th08-card-results .th08-menu-item {
        flex: 1 1 auto;
        padding: 9px 10px;
        font-size: 0.78rem;
      }
      .th08-result-anm {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .th08-result-stats {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: ui-monospace, 'Courier New', monospace;
        font-size: 2.6cqi;
        line-height: 1;
      }
      .th08-result-stat {
        position: absolute;
        transform-origin: left top;
        white-space: pre;
        /* `0xffffc0c0`, the colour the original sets for a settled row. */
        color: #ffffc0;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.75);
      }
      /* One line, because the panel above already carries the numbers. */
      .th08-result-banner {
        margin: 0;
        text-align: center;
        font:
          0.78rem/1.4 ui-monospace,
          'Courier New',
          monospace;
        letter-spacing: 0.18em;
        color: #5bb8b3;
      }
      .th08-result-aux {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 16px;
        margin: 0;
        font:
          0.76rem/1.4 ui-monospace,
          'Courier New',
          monospace;
        color: #a69a9d;
      }
      .th08-result-aux b {
        font-weight: 500;
        color: #e8dcc8;
      }
      .th08-rank {
        color: #f4dfae;
      }
      .th08-result-form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      /*
       * The listing colours are the ones `ResultScreen::OnDraw` sets: `0xffe0e0ef`
       * for the header, `0xffffc0c0` for a settled row, and `0xfff0f0ff` for the
       * record the run just earned.
       */
      .th08-result-listing th {
        color: #e0e0ef;
      }
      .th08-result-listing td {
        color: #ffffc0;
        /* The columns are padded with spaces the way `AddFormatText` pads them. */
        white-space: pre;
      }
      .th08-result-listing tr.is-new td {
        color: #fff0f0;
      }
      .th08-name-entry {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.82rem;
        color: #a69a9d;
      }
      .th08-name-entry input {
        flex: 1;
        padding: 8px 10px;
        font: inherit;
        color: #e8dcc8;
        background: #171523;
        border: 1px solid #4a3e4e;
        border-radius: 6px;
      }
      .th08-replay-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .th08-mini-btn {
        padding: 7px 12px;
        font: 0.78rem monospace;
        color: #5bb8b3;
        background: rgba(23, 21, 35, 0.9);
        border: 1px solid #3b5f5c;
        border-radius: 6px;
        cursor: pointer;
      }
      .th08-mini-btn:hover {
        color: #f4dfae;
        border-color: #d4a94e;
      }
      .th08-score-table {
        width: 100%;
        border-collapse: collapse;
        font: 0.78rem monospace;
      }
      .th08-score-table th,
      .th08-score-table td {
        padding: 5px 8px;
        text-align: left;
        border-bottom: 1px solid rgba(91, 184, 179, 0.2);
      }
      .th08-score-table th {
        color: #5bb8b3;
        font-weight: 500;
      }
      .th08-key-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
        font-size: 0.84rem;
      }
      .th08-key-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        background: rgba(23, 21, 35, 0.8);
        border: 1px solid #3a3145;
        border-radius: 8px;
      }
      .th08-key-list b {
        color: #f4dfae;
        font-family: monospace;
      }
      .th08-key-list span {
        color: #a69a9d;
      }
      /* ---- pause overlay ---- */
      .th08-pause {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        background: rgba(6, 5, 12, 0.72);
        backdrop-filter: blur(3px);
      }
      .th08-pause-card {
        width: min(84%, 320px);
        padding: 20px 22px;
        display: grid;
        gap: 10px;
        text-align: center;
        background: linear-gradient(160deg, rgba(38, 30, 54, 0.97), rgba(12, 11, 22, 0.98));
        border: 1px solid rgba(91, 184, 179, 0.6);
        border-radius: 12px;
      }
      .th08-pause-card h3 {
        margin: 0;
        color: #d4a94e;
        letter-spacing: 0.2em;
      }
      .th08-pause-kicker {
        margin: 0;
        font: 0.68rem/1.4 monospace;
        letter-spacing: 0.3em;
        color: #5bb8b3;
      }
      .th08-pause-list {
        display: grid;
        gap: 6px;
      }
      .th08-pause-list button {
        padding: 9px 12px;
        font: 0.86rem/1.4 monospace;
        color: #e8dcc8;
        text-align: left;
        background: rgba(20, 18, 32, 0.9);
        border: 1px solid #4a3e4e;
        border-radius: 7px;
        cursor: pointer;
      }
      .th08-pause-list button.is-active {
        border-color: #d4a94e;
        color: #ffeec4;
        background: rgba(52, 42, 30, 0.95);
      }
      .th08-pause-list span {
        color: #5bb8b3;
      }
      .th08-pause-hint {
        margin: 0;
        font-size: 0.7rem;
        color: #8c827a;
      }
      /* Stage-side dialogue: portrait left, speaker + typewriter text right. */
      .th08-dialog {
        position: absolute;
        left: 1.5%;
        right: 31.5%;
        bottom: 2.5%;
        z-index: 7;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px 14px 14px;
        background: linear-gradient(150deg, rgba(30, 24, 46, 0.95), rgba(9, 9, 18, 0.97));
        border: 1px solid rgba(91, 184, 179, 0.55);
        border-radius: 12px;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.6);
        animation: th08-dialog-in 180ms ease-out;
      }
      @keyframes th08-dialog-in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .th08-dialog-face {
        flex: 0 0 92px;
        width: 92px;
        height: 132px;
        margin-top: -26px;
        border-radius: 10px;
        background-color: rgba(212, 169, 78, 0.1);
        background-repeat: no-repeat;
        background-position: center bottom;
        background-size: contain;
        border: 1px solid rgba(212, 169, 78, 0.5);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .th08-dialog-face.has-face {
        border-color: transparent;
        background-color: transparent;
      }
      .th08-dialog-face:not(.has-face)::before {
        content: attr(data-speaker);
        font: 700 1.5rem/1 serif;
        color: #d4a94e;
        letter-spacing: 0;
      }
      .th08-dialog-main {
        flex: 1 1 auto;
        min-width: 0;
        display: grid;
        gap: 5px;
      }
      .th08-dialog-name {
        margin: 0;
        font: 0.74rem/1.3 monospace;
        letter-spacing: 0.22em;
        color: #5bb8b3;
      }
      .th08-dialog-text {
        margin: 0;
        min-height: 3.6em;
        font: 0.92rem/1.65 serif;
        color: #f2ece0;
        text-wrap: pretty;
      }
      .th08-dialog-text.is-typing::after {
        content: '';
        display: inline-block;
        width: 0.5em;
        border-bottom: 2px solid #d4a94e;
        margin-left: 2px;
        vertical-align: baseline;
      }
      .th08-dialog-hint {
        position: absolute;
        right: 12px;
        bottom: 6px;
        margin: 0;
        font: 0.6rem/1 monospace;
        letter-spacing: 0.14em;
        color: #7d746c;
      }
      /* ---- touch pad ---- */
      .th08-touch {
        position: absolute;
        inset: auto 0 0 0;
        z-index: 6;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .th08-touch-btn {
        pointer-events: auto;
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        padding: 0;
        color: #f4dfae;
        font: 0.62rem/1 monospace;
        background: transparent;
        border: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      .th08-touch-btn img {
        grid-area: 1 / 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0.9;
      }
      .th08-touch-btn span {
        grid-area: 1 / 1;
        align-self: center;
      }
      .th08-touch-btn.is-down {
        filter: brightness(1.5);
        transform: scale(0.94);
      }
      .th08-touch-shoot,
      .th08-touch-bomb {
        margin-left: auto;
      }
      /*
       * Pixi writes an inline width/height onto the canvas, so the stylesheet has
       * to win with !important or the game stays a 640x480 card in the corner.
       */
      #game-root canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      /* Engine harness links: useful to us, not something a player should see. */
      .shell-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 12px;
        font-size: 0.72rem;
        color: #6d645f;
        text-align: center;
        line-height: 1.8;
        opacity: 0.55;
        transition: opacity 220ms ease;
      }
      .shell-footer a {
        color: #5bb8b3;
        text-decoration: none;
        margin: 0 8px;
      }
      .shell-footer a:hover {
        text-decoration: underline;
      }
      /* A run takes over the whole page: header and harness fade out. */
      body.is-playing header,
      body.is-playing .shell-footer {
        opacity: 0;
        pointer-events: none;
      }
      /* A run reclaims the chrome's layout space too, so the playfield fills the height. */
      body.is-playing header {
        visibility: hidden;
        margin: 0;
        height: 0;
        overflow: hidden;
      }
      body.is-playing #game-root {
        width: min(100vw, calc(100dvh * 4 / 3));
        height: min(100dvh, calc(100vw * 3 / 4));
        border-radius: 0;
        /* The teal frame is page chrome. A run is edge to edge, so the 2px top and
         * bottom borders go too -- they were the last thing between the canvas and
         * a full-height playfield. */
        border: none;
      }
      header,
      .shell-footer {
        transition: opacity 220ms ease;
      }
      @media (max-width: 700px) {
        #game-root {
          width: 100vw;
          height: 75vw;
          border-radius: 0;
          border-left: none;
          border-right: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/touhou-web-engine/assets/index-CGIuwpKc.js"></script>
  </head>
  <body>
    <div id="menu-root"></div>
    <header>
      <h1>東方永夜抄 ~ Imperishable Night (Full Campaign)</h1>
      <p class="instructions">
        移动: <span>方向键 / WASD</span> | 射击: <span>Z / Space</span> | 灵击(Bomb): <span>X</span> | 低速:
        <span>Shift</span> | 暂停: <span>ESC</span> | 性能监控: <span>F12</span> | 触屏:
        <span>拖动自机</span>（拖动即 <span>自动射击</span>）
      </p>
    </header>

    <div id="game-root"></div>

    <footer class="shell-footer">
      引擎演示页:
      <a href="./demo/input-test.html">输入测试 Input</a>
      <a href="./demo/collision-test.html">碰撞测试 Collision</a>
      <a href="./demo/renderer-test.html">渲染测试 Renderer</a>
    </footer>

  </body>
</html>

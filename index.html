<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touhou Web Engine - TH08 Stage 1 Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b0a12;
        color: #e8dcc8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      header {
        margin-bottom: 12px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, #c41e3a, #d4a94e, #5bb8b3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 4px;
      }
      .instructions {
        font-size: 0.85rem;
        color: #8c827a;
      }
      .instructions span {
        display: inline-block;
        padding: 1px 6px;
        background: #221c24;
        border: 1px solid #4a3e4e;
        border-radius: 4px;
        color: #e8dcc8;
        margin: 0 2px;
        font-family: monospace;
      }
      #game-root {
        position: relative;
        width: 640px;
        height: 480px;
        max-width: 100vw;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(91, 184, 179, 0.2);
        border: 2px solid #2f7571;
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #audio-controls {
        margin-top: 14px;
        display: flex;
        gap: 12px;
      }
      #audio-controls button {
        padding: 6px 18px;
        font-size: 0.9rem;
        font-family: inherit;
        color: #e8dcc8;
        background: #221c24;
        border: 1px solid #4a3e4e;
        border-radius: 4px;
        cursor: pointer;
      }
      #audio-controls button:hover {
        border-color: #5bb8b3;
      }
      footer {
        margin-top: 14px;
        font-size: 0.8rem;
        color: #8c827a;
        text-align: center;
        line-height: 1.8;
      }
      footer a {
        color: #5bb8b3;
        text-decoration: none;
        margin: 0 8px;
      }
      footer a:hover {
        text-decoration: underline;
      }
      @media (max-width: 700px) {
        #game-root {
          width: 100vw;
          height: 75vw;
          border-radius: 0;
          border-left: none;
          border-right: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>東方永夜抄 ~ Imperishable Night (Stage 1 Demo)</h1>
      <p class="instructions">
        移动: <span>方向键 / WASD</span> | 射击: <span>Z / Space</span> | 灵击(Bomb): <span>X</span> | 低速: <span>Shift</span> | 暂停: <span>ESC</span> | 性能监控: <span>F12</span> | 触屏: <span>拖动自机</span>（拖动即 <span>自动射击</span>）
      </p>
    </header>

    <div id="game-root"></div>

    <div id="audio-controls">
      <button type="button" id="bgm-toggle">BGM: 播放「/audio/bgm/stage1.wav」</button>
      <button type="button" id="se-shoot">射击 SE</button>
    </div>

    <footer>
      引擎演示页:
      <a href="./demo/input-test.html">输入测试 Input</a>
      <a href="./demo/collision-test.html">碰撞测试 Collision</a>
      <a href="./demo/renderer-test.html">渲染测试 Renderer</a>
    </footer>

    <script type="module">
      import { TH08Game } from './src/games/th08/TH08Game.ts';

      window.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('game-root');
        const game = new TH08Game();
        await game.init(container);
        game.start();
        window.__TOUHOU_GAME__ = game;

        // Audio demo controls: BGM toggle plays the placeholder stage1.wav,
        // the SE button plays the placeholder shoot.wav (per-play volume 0.6).
        const bgmToggle = document.getElementById('bgm-toggle');
        const seButton = document.getElementById('se-shoot');
        bgmToggle.addEventListener('click', () => {
          if (game.audio.isBgmPlaying && !game.isPaused) {
            game.audio.pauseBGM();
          } else {
            game.audio.playBGM('./audio/bgm/stage1.wav', {
              loop: true,
              volume: 0.7,
              fadeIn: 1000,
            });
          }
          bgmToggle.textContent = game.audio.isBgmPlaying
            ? 'BGM: 暂停'
            : 'BGM: 播放「/audio/bgm/stage1.wav」';
        });
        seButton.addEventListener('click', () => {
          game.audio.playSE('shoot', { volume: 0.6 });
        });
      });
    </script>
  </body>
</html>

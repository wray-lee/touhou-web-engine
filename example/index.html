<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touhou Web Engine - 作为库使用示例</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b0a12;
        color: #e8dcc8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      header {
        margin-bottom: 12px;
        text-align: center;
        max-width: 640px;
      }
      h1 {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, #c41e3a, #d4a94e, #5bb8b3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }
      .note {
        font-size: 0.8rem;
        color: #8c827a;
        line-height: 1.6;
      }
      .note code {
        padding: 1px 6px;
        background: #221c24;
        border: 1px solid #4a3e4e;
        border-radius: 4px;
        color: #e8dcc8;
        font-family: monospace;
      }
      #game-root {
        position: relative;
        width: 640px;
        height: 480px;
        max-width: 100vw;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(91, 184, 179, 0.2);
        border: 2px solid #2f7571;
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      @media (max-width: 700px) {
        #game-root {
          width: 100vw;
          height: 75vw;
          border-radius: 0;
          border-left: none;
          border-right: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>作为库使用（Library Usage）— TH08 Stage 1</h1>
      <p class="note">
        本页面演示把引擎当作库嵌入的最小方式：<code>new TH08Game()</code> →
        <code>await game.init(container)</code> → <code>game.start()</code>。
        <br />
        此处为仓库内开发引用（<code>../src/games/th08/index.ts</code>）；生产环境应安装 npm 包并
        <code>import { TH08Game } from '@uestc-touhou/touhou-web-engine/th08'</code>。
      </p>
    </header>

    <div id="game-root"></div>

    <!-- external module: vite build.lib mode breaks inline <script type="module"> html-proxy -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>

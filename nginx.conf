server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The decoded retail tree is mounted here at runtime and never baked in.
    location /assets/th08/ {
        alias /th08-assets/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
